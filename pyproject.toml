[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spring-runtime-mcp"
dynamic = ["version"]
description = "Read-only, sanitized Spring Boot runtime diagnostics for coding agents over MCP."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Kaelenx" }]
keywords = ["mcp", "model-context-protocol", "spring-boot", "actuator", "diagnostics", "openapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Debuggers",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = ["jsonschema==4.25.1", "mcp>=2.3,<3"]

[dependency-groups]
dev = ["pytest==8.4.2", "mypy==1.18.2", "ruff==0.14.1"]

[project.urls]
Homepage = "https://github.com/Kaelenx/spring-runtime-mcp"
Repository = "https://github.com/Kaelenx/spring-runtime-mcp"
Issues = "https://github.com/Kaelenx/spring-runtime-mcp/issues"
Changelog = "https://github.com/Kaelenx/spring-runtime-mcp/blob/master/CHANGELOG.md"

[tool.hatch.version]
path = "src/spring_runtime_mcp/__init__.py"

[project.scripts]
spring-runtime-mcp = "spring_runtime_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spring_runtime_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "docs", "examples", "*.md", "LICENSE", "uv.lock"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# These are deliberate boundaries, not defects:
# BLE001: protocol and tool edges must turn unexpected failures into fixed envelopes.
# FURB162: keep the explicit Z suffix so observation timestamps stay timezone-aware.
# TRY004: invalid actuator shapes use ValueError domain codes caught as malformed evidence.
# PLR0124: `value == value` rejects NaN without also rejecting other floats.
ignore = ["BLE001", "FURB162", "TRY004", "PLR0124"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["spring_runtime_mcp"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
