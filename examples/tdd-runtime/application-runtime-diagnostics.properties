# Explicit local validation overlay; do not enable on an existing deployment.
server.address=127.0.0.1
server.port=0
management.server.address=127.0.0.1
management.server.port=18082
management.endpoints.access.max-permitted=read-only
management.endpoints.web.exposure.include=health,beans,conditions,mappings,flyway,startup
management.endpoints.web.exposure.exclude=shutdown,heapdump,logfile,sessions,loggers,caches,quartz
management.endpoint.env.access=none
management.endpoint.env.show-values=never
management.endpoint.configprops.access=none
management.endpoint.configprops.show-values=never
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
spring.jpa.hibernate.ddl-auto=validate
spring.main.banner-mode=off
